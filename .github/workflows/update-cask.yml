name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *"
  repository_dispatch:
    types: [update-cask]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update (e.g. 1.0.0). Leave empty to use latest release."
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.client_payload.version }}" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION=$(gh api repos/wakatoken/wakatoken/releases/latest --jq '.tag_name' | sed 's/^v//')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          is_sha256() {
            grep -Eq '^[a-f0-9]{64}$' <<< "$1"
          }

          for attempt in {1..60}; do
            SHA256_ARM64=$(gh api repos/wakatoken/wakatoken/releases/tags/v${VERSION} \
              --jq '.assets[] | select(.name == "WakaToken_'${VERSION}'_aarch64.dmg") | .digest' \
              | sed 's/^sha256://')

            SHA256_X64=$(gh api repos/wakatoken/wakatoken/releases/tags/v${VERSION} \
              --jq '.assets[] | select(.name == "WakaToken_'${VERSION}'_x64.dmg") | .digest' \
              | sed 's/^sha256://')

            if is_sha256 "$SHA256_ARM64" && is_sha256 "$SHA256_X64"; then
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for v${VERSION} macOS dmg assets"
              echo "SHA256 arm64: $SHA256_ARM64"
              echo "SHA256 x64: $SHA256_X64"
              exit 1
            fi

            echo "Waiting for v${VERSION} macOS dmg assets (${attempt}/60)"
            sleep 30
          done

          echo "sha256_arm64=$SHA256_ARM64" >> "$GITHUB_OUTPUT"
          echo "sha256_x64=$SHA256_X64" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "SHA256 arm64: $SHA256_ARM64"
          echo "SHA256 x64: $SHA256_X64"

      - name: Update Cask
        run: |
          VERSION=${{ steps.release.outputs.version }}
          SHA256_ARM64=${{ steps.release.outputs.sha256_arm64 }}
          SHA256_X64=${{ steps.release.outputs.sha256_x64 }}

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/wakatoken.rb
          sed -i "0,/sha256 \"[a-f0-9]*\"/s//sha256 \"${SHA256_ARM64}\"/" Casks/wakatoken.rb
          sed -i "0,/sha256 \"[a-f0-9]*\"/!{s/sha256 \"[a-f0-9]*\"/sha256 \"${SHA256_X64}\"/}" Casks/wakatoken.rb

          echo "Updated Casks/wakatoken.rb:"
          cat Casks/wakatoken.rb

      - name: Check if update is needed
        id: check
        run: |
          if git diff --quiet -- Casks/wakatoken.rb; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION=${{ steps.release.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/wakatoken.rb
          git commit -m "chore: update wakatoken to v${VERSION}"
          git push
